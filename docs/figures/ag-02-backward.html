<!-- title: The backward pass
     lib: fig, ag
     height: 540 -->
<figure class="fig">
  <canvas id="agb-cv" class="c-ag" role="img" aria-label="The same graph with all values computed. Gradients travel from L back to the leaves, one tensor at a time; the tensor a receives two contributions that add up."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="agb-a">a</label><output id="agb-a-o"></output></div><input id="agb-a" type="range" min="-3" max="3" step="0.5" value="2" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="agb-b">b</label><output id="agb-b-o"></output></div><input id="agb-b" type="range" min="-3" max="3" step="0.5" value="3" autocomplete="off"></div>
    <button class="btn" type="button" id="agb-step">Step</button>
    <button class="btn" type="button" id="agb-play">Pause</button>
  </div>
  <div class="readout" id="agb-read"></div>
  <figcaption><b>Fig.</b> <code>L.backward()</code> on the graph from Fig. 1. The tensors are processed in the order L, e, d, so each one has its complete gradient before it passes it on. Every arrow multiplies the gradient by the local derivative of its operation. <code>a</code> is reached twice, once through <code>e</code> and once through <code>d</code>, and the two contributions add.</figcaption>
</figure>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('agb-cv'), ia = $('agb-a'), ib = $('agb-b'), read = $('agb-read'), bStep = $('agb-step'), bPlay = $('agb-play');
  const SHOWN = { a: 1, b: 1, d: 1, e: 1, L: 1 };
  let step = 0, t = 1, hold = 0, playing = !Fig.reduceMotion;      // step 0: seed, steps 1..3: one tensor each

  function draw() {
    const v = AG.forward(+ia.value, +ib.value), steps = AG.backwardSteps(v), grads = { L: 1 }, lines = [];
    const done = k => k < step || (k === step && t >= 1);          // has step k delivered its gradients?
    steps.forEach((s, i) => {
      const k = i + 1;
      s.sends.forEach(c => {
        const before = grads[c.to], add = grads[s.node] * c.local;
        if (done(k)) grads[c.to] = (before ?? 0) + add;
        if (k === step) lines.push(`${c.to}.grad ${before === undefined ? '=' : '+='} ${s.node}.grad · ${c.text}  <span class="k">→</span>  <span class="gr">${AG.fmt((before ?? 0) + add)}</span>`);
      });
    });
    const cur = step > 0 ? steps[step - 1] : null;
    const pulses = cur && t < 1 ? cur.sends.map(c => ({ from: cur.node, to: c.to, t })) : [];
    AG.draw(cv, { values: v, shown: SHOWN, grads, active: cur ? cur.node : 'L', pulses });
    $('agb-a-o').textContent = AG.fmt(v.a); $('agb-b-o').textContent = AG.fmt(v.b);
    const order = ['L', 'e', 'd'].map((n, i) => i === step - 1 ? `<span class="hl">${n}</span>` : `<span class="k">${n}</span>`).join('<span class="k"> → </span>');
    read.innerHTML = `<span class="k">order </span>${order}<br>` + (cur ? lines.join('<br>') : 'L.grad = 1  <span class="k">(seed: ∂L/∂L)</span>');
    bPlay.textContent = playing ? 'Pause' : 'Play';
  }
  function advance() { step = step >= 3 ? 0 : step + 1; t = Fig.reduceMotion || step === 0 ? 1 : 0; hold = 0; }

  Fig.loop(cv, dt => {
    if (t < 1) { t = Math.min(1, t + dt / 0.9); draw(); return; }
    if (!playing) return;
    hold += dt;
    if (hold > (step === 3 ? 3 : 1.3)) { advance(); draw(); }
  });
  bStep.addEventListener('click', () => { playing = false; advance(); draw(); });
  bPlay.addEventListener('click', () => { playing = !playing; hold = 0; draw(); });
  [ia, ib].forEach(el => el.addEventListener('input', draw));
  Fig.onRedraw(cv, draw);
})();
</script>
