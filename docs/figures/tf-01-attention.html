<!-- title: Attention as a weighted mean
     lib: fig, tf
     height: 560 -->
<figure class="fig">
  <canvas id="ta-cv" class="c-tf c-tf-drag" tabindex="0" role="img" aria-label="A plane with five key vectors and a query vector that can be dragged. Each key gets a weight from the softmax of its dot product with the query; the output, the weighted mean of the values, is drawn as a red diamond. Bars on the right show the weights."></canvas>
  <div class="readout" id="ta-read"></div>
  <figcaption><b>Fig.</b> Drag the query \(q\) (or focus the figure and use the arrow keys). Each key \(k_i\) gets the weight \(\operatorname{softmax}_i(q \cdot k_i / \sqrt{d})\); here the values equal the keys, and the output is their weighted mean. A query pointing towards a key gives it most of the weight. A longer query sharpens the distribution, a short one spreads the weight evenly.</figcaption>
</figure>
<script>
(() => {
  const cv = document.getElementById('ta-cv'), read = document.getElementById('ta-read');
  const KEYS = [[2.1, 0.4], [0.9, 2.1], [-1.9, 1.2], [-1.4, -1.8], [1.3, -1.9]], NAMES = ['k₁', 'k₂', 'k₃', 'k₄', 'k₅'], R = 3;
  let q = [1.4, 1.1], dragging = false, geo = null;
  const weights = () => TF.softmax(KEYS.map(k => (q[0] * k[0] + q[1] * k[1]) / Math.SQRT2));

  function draw() {
    const { ctx, w, h } = Fig.fit(cv), fg = Fig.token('--fg'), muted = Fig.token('--muted'), grid = Fig.token('--grid'), accent = Fig.token('--accent'), hole = Fig.token('--hole');
    const narrow = w < 520, side = narrow ? Math.min(w - 16, h * 0.58) : Math.min(h - 12, w * 0.5);
    const px0 = narrow ? (w - side) / 2 : 8, py0 = 6, P = v => [px0 + (v[0] + R) / (2 * R) * side, py0 + (R - v[1]) / (2 * R) * side];
    geo = { px0, py0, side };
    ctx.lineWidth = 1;
    for (let v = -R; v <= R; v++) {
      ctx.strokeStyle = v === 0 ? Fig.token('--rule') : grid;
      const [x] = P([v, 0]), [, y] = P([0, v]);
      ctx.beginPath(); ctx.moveTo(x, py0); ctx.lineTo(x, py0 + side); ctx.moveTo(px0, y); ctx.lineTo(px0 + side, y); ctx.stroke();
    }
    const a = weights(), out = [0, 1].map(d => KEYS.reduce((s, k, i) => s + a[i] * k[d], 0));
    KEYS.forEach((k, i) => {
      const [x, y] = P(k), r = 5 + 13 * Math.sqrt(a[i]);
      ctx.fillStyle = Fig.rgba(accent, 0.18 + 0.6 * a[i]); ctx.strokeStyle = accent; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      ctx.fillStyle = fg; ctx.font = `600 13px ${Fig.DISPLAY}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(NAMES[i], x + r + 4, y);
    });
    const [ox, oy] = P([0, 0]), [qx, qy] = P(q);
    ctx.strokeStyle = fg; ctx.fillStyle = fg; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(qx, qy); ctx.stroke();
    const ang = Math.atan2(qy - oy, qx - ox);
    ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(qx - 9 * Math.cos(ang - 0.4), qy - 9 * Math.sin(ang - 0.4)); ctx.lineTo(qx - 9 * Math.cos(ang + 0.4), qy - 9 * Math.sin(ang + 0.4)); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(qx, qy, 6, 0, 2 * Math.PI); ctx.strokeStyle = fg; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = `600 14px ${Fig.DISPLAY}`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('q', qx + 8, qy - 4);
    const [yx, yy] = P(out);
    ctx.fillStyle = hole; ctx.beginPath(); ctx.moveTo(yx, yy - 8); ctx.lineTo(yx + 8, yy); ctx.lineTo(yx, yy + 8); ctx.lineTo(yx - 8, yy); ctx.closePath(); ctx.fill();
    // label on the side facing away from q, so it never sits on the query arrow
    let dx = yx - qx, dy = yy - qy; const len = Math.hypot(dx, dy);
    if (len < 4) { dx = -1; dy = 1; } else { dx /= len; dy /= len; }
    ctx.fillStyle = hole; ctx.font = `600 13px ${Fig.DISPLAY}`; ctx.textAlign = dx >= 0 ? 'left' : 'right'; ctx.textBaseline = dy >= 0 ? 'top' : 'bottom';
    ctx.fillText('output', yx + 12 * dx + (dx >= 0 ? 4 : -4), yy + 12 * dy);

    // weights as bars
    const bx = narrow ? 30 : px0 + side + 56, by = narrow ? py0 + side + 34 : 30, bw = narrow ? w - 46 : w - bx - 16, bh = narrow ? h - by - 22 : h - by - 28;
    TF.label(ctx, 'attention weights', bx, by - 8);
    const slot = bw / KEYS.length;
    ctx.strokeStyle = Fig.token('--rule'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.stroke();
    ctx.font = `500 11px ${Fig.MONO}`; ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (const v of [0, 0.5, 1]) { ctx.fillText(TF.fmt(v, 1), bx - 6, by + bh - v * bh); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(bx, by + bh - v * bh); ctx.lineTo(bx + bw, by + bh - v * bh); ctx.stroke(); }
    a.forEach((v, i) => {
      const x = bx + i * slot + slot * 0.2, bwid = slot * 0.6;
      ctx.fillStyle = accent; ctx.fillRect(x, by + bh - v * bh, bwid, v * bh);
      ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.font = `500 11px ${Fig.MONO}`; ctx.fillText(TF.fmt(v, 2), x + bwid / 2, by + bh - v * bh - 3);
      ctx.textBaseline = 'top'; ctx.font = `600 13px ${Fig.DISPLAY}`; ctx.fillStyle = muted; ctx.fillText(NAMES[i], x + bwid / 2, by + bh + 4);
    });
    const sc = KEYS.map(k => (q[0] * k[0] + q[1] * k[1]) / Math.SQRT2);
    read.innerHTML = `<span class="k">q = </span>(${TF.fmt(q[0])}, ${TF.fmt(q[1])})   <span class="k">|q| = </span>${TF.fmt(Math.hypot(...q), 2)}\n<span class="k">scores q·k/√2  </span>${sc.map(v => TF.fmt(v, 2)).join('  ')}\n<span class="k">output = Σ aᵢvᵢ </span><span class="gr">(${TF.fmt(out[0], 2)}, ${TF.fmt(out[1], 2)})</span>`;
  }
  function setFrom(e) {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    q = [Fig.clamp((x - geo.px0) / geo.side * 2 * R - R, -R, R), Fig.clamp(R - (y - geo.py0) / geo.side * 2 * R, -R, R)]; draw();
  }
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (x < geo.px0 || x > geo.px0 + geo.side || y < geo.py0 || y > geo.py0 + geo.side) return;
    dragging = true; cv.setPointerCapture(e.pointerId); setFrom(e);
  });
  cv.addEventListener('pointermove', e => { if (dragging) setFrom(e); });
  cv.addEventListener('pointerup', () => { dragging = false; });
  cv.addEventListener('keydown', e => {
    const d = { ArrowLeft: [-0.1, 0], ArrowRight: [0.1, 0], ArrowUp: [0, 0.1], ArrowDown: [0, -0.1] }[e.key];
    if (!d) return; e.preventDefault(); q = [Fig.clamp(q[0] + d[0], -R, R), Fig.clamp(q[1] + d[1], -R, R)]; draw();
  });
  Fig.onRedraw(cv, draw);
})();
</script>
