<!-- title: Learning-rate schedules
     lib: fig, tr
     height: 520 -->
<figure class="fig">
  <canvas id="ts-cv" class="c-tr-wide" role="img" aria-label="The learning rate over the training steps for the selected schedule, with a marker moving along the curve."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="ts-k">Schedule</label></div>
      <select id="ts-k" autocomplete="off"><option value="cos">WarmupCosineLR</option><option value="step">StepLR</option></select></div>
    <div class="ctrl" id="ts-c1"><div class="lab"><label for="ts-w">Warmup steps</label><output id="ts-w-o"></output></div><input id="ts-w" type="range" min="0" max="3000" step="100" value="300" autocomplete="off"></div>
    <div class="ctrl" id="ts-c2"><div class="lab"><label for="ts-m">min_lr / base_lr</label><output id="ts-m-o"></output></div><input id="ts-m" type="range" min="0" max="0.5" step="0.05" value="0.1" autocomplete="off"></div>
    <div class="ctrl" id="ts-c3" hidden><div class="lab"><label for="ts-s">step_size</label><output id="ts-s-o"></output></div><input id="ts-s" type="range" min="500" max="5000" step="500" value="5000" autocomplete="off"></div>
    <div class="ctrl" id="ts-c4" hidden><div class="lab"><label for="ts-g">gamma</label><output id="ts-g-o"></output></div><input id="ts-g" type="range" min="0.1" max="0.9" step="0.1" value="0.3" autocomplete="off"></div>
  </div>
  <div class="readout" id="ts-read"></div>
  <figcaption><b>Fig.</b> 15 000 steps with base learning rate \(3\cdot10^{-4}\), as in the Shakespeare example. Warmup raises the rate linearly from zero, then a cosine brings it smoothly down to <code>min_lr</code>. <code>StepLR</code> multiplies the rate by <code>gamma</code> every <code>step_size</code> steps.</figcaption>
</figure>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('ts-cv'), sk = $('ts-k'), iw = $('ts-w'), im = $('ts-m'), is = $('ts-s'), ig = $('ts-g'), read = $('ts-read'), BASE = 3e-4, TOTAL = 15000;
  let t = 0;
  function lr(step) {
    if (sk.value === 'step') return BASE * Math.pow(+ig.value, Math.floor(step / +is.value));
    const wu = +iw.value, min = BASE * +im.value;
    if (step < wu) return BASE * step / wu;
    if (step >= TOTAL) return min;
    const prog = (step - wu) / (TOTAL - wu);
    return min + (BASE - min) * 0.5 * (1 + Math.cos(Math.PI * prog));
  }
  function draw() {
    const { ctx, w, h } = Fig.fit(cv), accent = Fig.token('--accent'), fg = Fig.token('--fg');
    const cos = sk.value === 'cos';
    ['ts-c1', 'ts-c2'].forEach(id => { $(id).hidden = !cos; }); ['ts-c3', 'ts-c4'].forEach(id => { $(id).hidden = cos; });
    const box = { x: 62, y: 24, w: w - 62 - 30, h: h - 24 - 28 };
    const { px, py } = TR.frame(ctx, box, { xmin: 0, xmax: TOTAL, ymin: 0, ymax: 3.3e-4, xticks: [0, 5000, 10000, 15000], yticks: [0, 1e-4, 2e-4, 3e-4], yfmt: v => v === 0 ? '0' : TR.sci(v).replace('.00', ''), title: 'learning rate' });
    ctx.strokeStyle = accent; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.beginPath();
    for (let s = 0; s <= TOTAL; s += 25) { const v = lr(s); s ? ctx.lineTo(px(s), py(v)) : ctx.moveTo(px(s), py(v)); }
    ctx.stroke();
    const s = Math.round(t * TOTAL);
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(px(s), py(lr(s)), 5, 0, 2 * Math.PI); ctx.fill();
    $('ts-w-o').textContent = iw.value; $('ts-m-o').textContent = TR.fmt(+im.value, 2); $('ts-s-o').textContent = is.value; $('ts-g-o').textContent = TR.fmt(+ig.value, 1);
    read.innerHTML = `<span class="k">step </span>${s}   <span class="k">learning rate </span><span class="hl">${TR.sci(lr(s))}</span>`;
  }
  Fig.loop(cv, dt => { t = (t + dt / 8) % 1; draw(); });
  [sk, iw, im, is, ig].forEach(el => el.addEventListener('input', draw));
  Fig.onRedraw(cv, draw);
})();
</script>
